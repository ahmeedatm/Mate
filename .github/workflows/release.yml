# Release : un tag vX.Y.Z sur master (seuls les admins posent un tag v*, règle « tags de version ») publie l'APK signé,
# les applis portables de l'ordinateur et les archives du backend dans la release `latest`, lue par les tablettes
# (scripts/updates-publish.mjs, docs/developpement.md, section Release). Le helper Windows n'est pas recompilé ici.

name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # APK release NON signé, version = le tag : le code du dépôt (Gradle) ne voit jamais la clé. Signé à part par `signer`.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # bash : le shell par défaut d'un conteneur est sh, sans pipefail.
      - name: APK non signé
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor HEAD origin/master || { echo "::error::Le tag n'est pas sur master"; exit 1; }
          test -n "$UPDATE_TOKEN" || echo "::warning::UPDATE_TOKEN absent : les tablettes liront les releases sans jeton"
          ./gradlew --no-daemon --console=plain assembleRelease -PappVersion="${GITHUB_REF_NAME#v}" -PupdateToken="$UPDATE_TOKEN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-non-signe
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  # Paquet app.mate « Mate » lu dans l'APK (jamais l'appli d'essai en stable), puis signature : seule étape qui voit la
  # clé (.github/apk-signe.sh, comme pour les essais).
  signer:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-non-signe
          path: ${{ runner.temp }}/recu
      - run: |
          mkdir -p dist
          .github/apk-signe.sh verifier "$RUNNER_TEMP/recu/app-release-unsigned.apk" "${GITHUB_REF_NAME#v}" app.mate Mate \
            "$RUNNER_TEMP/aligne.apk" "dist/companion-${GITHUB_REF_NAME#v}.json"
      - env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: .github/apk-signe.sh signer "$RUNNER_TEMP/aligne.apk" "dist/companion-${GITHUB_REF_NAME#v}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Applis portables (Mate-Windows.exe, Mate-Mac.zip, node embarqué) et archives du backend (sans node), version = le
  # tag (backend/scripts/package.ts). zip et unzip : runtime Windows zippé puis ajouté à l'exe, appli Mac zippée.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: node:22.22-bookworm
    strategy:
      matrix:
        target: [windows, mac, essai]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends zip unzip > /dev/null
      - working-directory: backend
        env:
          TARGET: ${{ matrix.target }}
          # Version des paquets : backend/scripts/package.ts la lit dans CI_COMMIT_TAG (nom hérité de GitLab).
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          npm ci --no-audit --no-fund
          npm run package -- "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/backend-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  # Release `latest` : manifest.json, l'APK et les fichiers de l'ordinateur ; les anciens assets sont supprimés.
  publier:
    needs: [signer, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          node scripts/updates-publish.mjs dist updates
