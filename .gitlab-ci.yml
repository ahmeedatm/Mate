# CI : sur chaque MR, sur main, sur les tags et chaque nuit (pipeline programmé). Rien n'arrive sur main sans pipeline vert.
# En MR, seuls les jobs de la zone touchée tournent (rules:changes, voir docs/developpement.md, section CI) ;
# sur main, sur un tag et la nuit, tout tourne.
# Tag vX.Y.Z : mêmes tests, puis paquets de l'ordinateur, APK signé et release GitLab.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - install
  - release

default:
  interruptible: true

# Jobs de release : seulement sur un tag de version.
.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Zones du dépôt. Changer la CI relance tout.
.files-backend: &files-backend
  - backend/**/*
  - .gitlab-ci.yml
.files-android: &files-android
  - app/**/*
  - "*.gradle*"
  - gradle/**/*
  - gradlew*
  - scripts/test-android.sh
  - .gitlab-ci.yml
# Installation : pilote, lancement automatique, paquets, installeurs, aiguillage par système, sanity.
.files-install-common: &files-install-common
  - backend/scripts/**/*
  - backend/src/os.ts
  - backend/src/paths.ts
  - backend/package-lock.json
  - backend/qa/**/*
  - .gitlab-ci.yml
.files-install-windows: &files-install-windows
  - backend/src/win/**/*
  - "Installer (Windows).cmd"
# Pilote Windows et lanceur (C#) : sources, SDK, icône, fins de ligne.
.files-helper-windows: &files-helper-windows
  - backend/src/win/**/*
  - backend/global.json
  - backend/assets/compagnon.ico
  - backend/qa/build-helper-windows.ps1
  - .gitattributes
  - .gitlab-ci.yml

# En MR : seulement si la zone a bougé. Ailleurs (main, tag, nuit) : toujours.
.zone-backend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-backend
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
.zone-android:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-android
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
.zone-install-windows:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-install-common
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-install-windows
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
.zone-helper-windows:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-helper-windows
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"

# Toujours là : une MR qui ne touche aucune zone (docs) a quand même un pipeline, sans lequel elle ne fusionne pas.
zones:
  stage: test
  image: node:22.22-bookworm-slim
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Jobs lancés selon les zones touchées (docs/developpement.md, section CI)."

.node:
  image: node:22.22-bookworm-slim
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund

backend:
  extends: [.node, .zone-backend]
  stage: test
  script:
    - npm run typecheck
    # Tests d'intégration : le vrai serveur démarre avec un dossier de données vide.
    - node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=junit.xml "test/**/*.test.ts"
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
    expire_in: 1 week

# Pages web du backend (page locale, visualiseur /camera, retour OAuth) dans Chromium, même serveur que les tests d'intégration.
# Tag de l'image = version exacte de @playwright/test dans backend/package.json : les monter ensemble.
e2e:
  extends: .zone-backend
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run test:e2e
  artifacts:
    when: always
    # junit.xml + traces des tests en échec (npx playwright show-trace <trace.zip>).
    paths:
      - backend/e2e-results/
    reports:
      junit: backend/e2e-results/junit.xml
    expire_in: 1 week

.android:
  image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - app/build.gradle.kts
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/

android:
  extends: [.android, .zone-android]
  stage: test
  script:
    - ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
  artifacts:
    when: always
    name: companion-debug-$CI_COMMIT_SHORT_SHA
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/reports/lint-results-debug.html
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    expire_in: 2 weeks

# Installation du paquet Mac sur le Mac d'un développeur (runner shell, tag macos) : backend/qa/install-mac.sh.
# Instance de test isolée de son vrai compagnon (agent, port, données à part), rien ne s'affiche à l'écran.
# Obligatoire seulement si l'installation ou le pilotage du Mac ont bougé (Mac éteint = job en attente) ;
# sur les autres MR, à lancer à la main.
install-mac:
  stage: test
  tags: [macos]
  needs: []
  interruptible: true
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key: install-mac
    paths:
      - .npm/
      - backend/.cache/node/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/src/mac/**/*
        - backend/src/os.ts
        - backend/src/paths.ts
        - backend/scripts/service.ts
        - backend/scripts/package.ts
        - backend/package-lock.json
        - backend/qa/install-mac.sh
        - Installer (Mac).command
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
  script:
    # node@18 passe avant dans le PATH du runner : celui de Homebrew (22 ou plus).
    - export PATH="/opt/homebrew/bin:$PATH"
    - node --version
    - node -e 'process.exit(Number(+process.versions.node.split(".")[0] < 22))'
    - (cd backend && npm ci --prefer-offline --no-audit --no-fund && npm run package -- mac)
    - backend/qa/install-mac.sh run dist/Compagnon-Unowhy-Mac.zip
  after_script:
    - backend/qa/install-mac.sh cleanup
  artifacts:
    when: always
    paths:
      - install-mac-backend.log
    expire_in: 1 week

# Tests instrumentés (app/src/androidTest/) sur un émulateur Android 10 sans services Google, 1280×800.
# Le runner Kubernetes partagé expose /dev/kvm (pod privilégié) : démarrage en ~25 s. Même script qu'en local.
android-emulateur:
  extends: [.android, .zone-android]
  stage: test
  timeout: 30m
  cache:
    policy: pull
  script:
    - scripts/test-android.sh
  artifacts:
    when: always
    paths:
      - app/build/test-android/
      - app/build/reports/androidTests/
    reports:
      junit: app/build/outputs/androidTest-results/connected/debug/*.xml
    expire_in: 2 weeks

# Paquets de l'ordinateur (node embarqué) : backend/scripts/package.ts. Un job par plateforme : les deux zips
# ensemble dépassent la limite d'artefacts par défaut (100 Mo). Consommés par les tests d'installation et la release.
.package:
  extends: .node
  stage: build
  dependencies: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends zip unzip > /dev/null
    - !reference [.node, before_script]
  script:
    - npm run package -- $PLATFORM
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 1 week

package-windows:
  extends: [.package, .zone-install-windows]
  variables:
    PLATFORM: windows

# install-mac fabrique son propre paquet : celui-ci sert à la release (et tourne sur main et la nuit).
package-mac:
  extends: .package
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
  variables:
    PLATFORM: mac

# Paquet Windows installé sur un vrai PC (runner « Local QA runner », shell PowerShell, session de bureau ouverte) :
# installeur silencieux, lancement automatique, sanity, pilote, désinstallation. Tout est propre au test
# (backend/qa/install-windows.ps1) ; after_script nettoie même après un échec : le PC sert aussi aux tests UEM.
install-windows:
  extends: .zone-install-windows
  stage: install
  tags: [local-runner]
  image: null
  needs: [package-windows]
  variables:
    GIT_DEPTH: 1
  before_script:
    - '& backend\qa\install-windows.ps1 -Nettoyage'
  script:
    - '& backend\qa\install-windows.ps1 -Zip dist\Compagnon-Unowhy-Windows.zip -Junit sanity-windows.xml -Logs install-logs'
  after_script:
    - '& backend\qa\install-windows.ps1 -Nettoyage'
  artifacts:
    when: always
    paths:
      - install-logs/
    reports:
      junit: sanity-windows.xml
    expire_in: 1 week

# Pilote et lanceur recompilés sous Windows : échoue si le C# ne compile pas ou si les exe commités ne sont plus
# ceux des sources (backend/qa/build-helper-windows.ps1). Runner partagé « HiSqool Windows » (Docker, Server Core,
# sans bureau : suffit pour compiler) ; image au SDK exact de backend/global.json, à monter ensemble.
helper-windows:
  extends: .zone-helper-windows
  stage: test
  tags: [windows, docker]
  image: mcr.microsoft.com/dotnet/sdk:8.0.427-windowsservercore-ltsc2019@sha256:2af66369a314ab0334ee8dfd6a67bc15485a51754087bc3bfc9427a35c84c0d8
  needs: []
  variables:
    GIT_DEPTH: 1
  script:
    - '& backend\qa\build-helper-windows.ps1 -Work .dotnet-ci'

# APK release signé, version = tag. Clé : variables protégées et masquées, visibles seulement des tags protégés (v*).
# Publie aussi l'entrée du « serveur Unowhy » (companion-X.Y.Z.json), lue par `npm run updates:add`.
android-release:
  extends: [.android, .release-tag]
  stage: build
  dependencies: []
  script:
    - test -n "$RELEASE_KEYSTORE_BASE64" -a -n "$RELEASE_KEYSTORE_PASSWORD"
      || { echo "Clé de signature absente (variables RELEASE_KEYSTORE_*, tag protégé v*)"; exit 1; }
    - VERSION=${CI_COMMIT_TAG#v}
    - echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.p12
    - RELEASE_KEYSTORE=/tmp/release.p12 ./gradlew --no-daemon --console=plain assembleRelease -PappVersion=$VERSION
    - mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk dist/companion-$VERSION.apk
    - $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs dist/companion-$VERSION.apk
    - CODE=$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging dist/companion-$VERSION.apk | sed -n "1s/.*versionCode='\([0-9]*\)'.*/\1/p")
    - jq -n --arg v "$VERSION" --argjson c "$CODE" --arg f "companion-$VERSION.apk"
      '{package:"com.unowhy.companion", label:"Companion", versionCode:$c, versionName:$v, file:$f}'
      > dist/companion-$VERSION.json
    - cat dist/companion-$VERSION.json
  artifacts:
    paths:
      - dist/companion-*
    expire_in: 1 week

# Release GitLab : fichiers déposés dans le registre de paquets générique du projet, jeton du job.
release:
  extends: .release-tag
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0@sha256:f6837b5aea075ca297281b554556d2fc4f8fb291ace6b48286790790dce622cd
  needs: [package-windows, package-mac, android-release]
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - >-
      glab release create "$CI_COMMIT_TAG" dist/* --use-package-registry --ref "$CI_COMMIT_SHA"
      --name "Compagnon $CI_COMMIT_TAG"
      --notes "Paquets de l'ordinateur (Windows, Mac) et APK de la tablette. Mise à jour de la tablette par le « serveur Unowhy » : docs/developpement.md, section Release."
