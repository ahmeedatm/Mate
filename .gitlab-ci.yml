# CI : sur chaque MR, sur main, sur les tags et chaque nuit (pipeline programmé). Rien n'arrive sur main sans pipeline vert.
# En MR, seuls les jobs de la zone touchée tournent (rules:changes, voir docs/developpement.md, section CI) ;
# sur main, sur un tag et la nuit, tout tourne.
# Tag vX.Y.Z : mêmes tests, puis paquets de l'ordinateur, APK signé et release GitLab.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release

default:
  interruptible: true

# Jobs de release : seulement sur un tag de version.
.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Zones du dépôt. Changer la CI relance tout.
.files-backend: &files-backend
  - backend/**/*
  - .gitlab-ci.yml
.files-android: &files-android
  - app/**/*
  - "*.gradle*"
  - gradle/**/*
  - gradlew*
  - .gitlab-ci.yml
# Installation : pilote, lancement automatique, paquets, installeurs, aiguillage par système, sanity.
.files-install-common: &files-install-common
  - backend/scripts/**/*
  - backend/src/os.ts
  - backend/qa/**/*
  - .gitlab-ci.yml
.files-install-windows: &files-install-windows
  - backend/src/win/**/*
  - "Installer (Windows).cmd"
.files-install-mac: &files-install-mac
  - backend/src/mac/**/*
  - "Installer (Mac).command"

# En MR : seulement si la zone a bougé. Ailleurs (main, tag, nuit) : toujours.
.zone-backend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-backend
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
.zone-android:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-android
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
.zone-install-windows:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-install-common
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-install-windows
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
.zone-install-mac:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-install-common
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-install-mac
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"

# Toujours là : une MR qui ne touche aucune zone (docs) a quand même un pipeline, sans lequel elle ne fusionne pas.
zones:
  stage: test
  image: node:22.22-bookworm-slim
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Jobs lancés selon les zones touchées (docs/developpement.md, section CI)."

.node:
  image: node:22.22-bookworm-slim
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund

backend:
  extends: [.node, .zone-backend]
  stage: test
  script:
    - npm run typecheck
    # Tests d'intégration : le vrai serveur démarre avec un dossier de données vide.
    - node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=junit.xml "test/**/*.test.ts"
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
    expire_in: 1 week

# Pages web du backend (page locale, visualiseur /camera, retour OAuth) dans Chromium, même serveur que les tests d'intégration.
# Tag de l'image = version exacte de @playwright/test dans backend/package.json : les monter ensemble.
e2e:
  extends: .zone-backend
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run test:e2e
  artifacts:
    when: always
    # junit.xml + traces des tests en échec (npx playwright show-trace <trace.zip>).
    paths:
      - backend/e2e-results/
    reports:
      junit: backend/e2e-results/junit.xml
    expire_in: 1 week

.android:
  image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - app/build.gradle.kts
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/

android:
  extends: [.android, .zone-android]
  stage: test
  script:
    - ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
  artifacts:
    when: always
    name: companion-debug-$CI_COMMIT_SHORT_SHA
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/reports/lint-results-debug.html
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    expire_in: 2 weeks

# Paquets de l'ordinateur (node embarqué) : backend/scripts/package.ts. Un job par plateforme : les deux zips
# ensemble dépassent la limite d'artefacts par défaut (100 Mo). Consommés par les tests d'installation et la release.
.package:
  extends: .node
  stage: build
  dependencies: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends zip unzip > /dev/null
    - !reference [.node, before_script]
  script:
    - npm run package -- $PLATFORM
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 1 week

package-windows:
  extends: [.package, .zone-install-windows]
  variables:
    PLATFORM: windows

package-mac:
  extends: [.package, .zone-install-mac]
  variables:
    PLATFORM: mac

# APK release signé, version = tag. Clé : variables protégées et masquées, visibles seulement des tags protégés (v*).
# Publie aussi l'entrée du « serveur Unowhy » (companion-X.Y.Z.json), lue par `npm run updates:add`.
android-release:
  extends: [.android, .release-tag]
  stage: build
  dependencies: []
  script:
    - test -n "$RELEASE_KEYSTORE_BASE64" -a -n "$RELEASE_KEYSTORE_PASSWORD"
      || { echo "Clé de signature absente (variables RELEASE_KEYSTORE_*, tag protégé v*)"; exit 1; }
    - VERSION=${CI_COMMIT_TAG#v}
    - echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.p12
    - RELEASE_KEYSTORE=/tmp/release.p12 ./gradlew --no-daemon --console=plain assembleRelease -PappVersion=$VERSION
    - mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk dist/companion-$VERSION.apk
    - $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs dist/companion-$VERSION.apk
    - CODE=$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging dist/companion-$VERSION.apk | sed -n "1s/.*versionCode='\([0-9]*\)'.*/\1/p")
    - jq -n --arg v "$VERSION" --argjson c "$CODE" --arg f "companion-$VERSION.apk"
      '{package:"com.unowhy.companion", label:"Companion", versionCode:$c, versionName:$v, file:$f}'
      > dist/companion-$VERSION.json
    - cat dist/companion-$VERSION.json
  artifacts:
    paths:
      - dist/companion-*
    expire_in: 1 week

# Release GitLab : fichiers déposés dans le registre de paquets générique du projet, jeton du job.
release:
  extends: .release-tag
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0@sha256:f6837b5aea075ca297281b554556d2fc4f8fb291ace6b48286790790dce622cd
  needs: [package-windows, package-mac, android-release]
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - >-
      glab release create "$CI_COMMIT_TAG" dist/* --use-package-registry --ref "$CI_COMMIT_SHA"
      --name "Compagnon $CI_COMMIT_TAG"
      --notes "Paquets de l'ordinateur (Windows, Mac) et APK de la tablette. Mise à jour de la tablette par le « serveur Unowhy » : docs/developpement.md, section Release."
