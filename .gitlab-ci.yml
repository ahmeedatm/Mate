# CI : sur chaque MR, sur main et sur les tags. Rien n'arrive sur main sans pipeline vert.
# En MR, seuls les jobs de la zone touchée tournent (rules:changes, voir docs/developpement.md, section CI) ;
# sur main et sur un tag, tout tourne.
# Tag vX.Y.Z : mêmes tests, puis installeurs de l'ordinateur, APK signé et release GitLab.
# Branche protégée essai/* : seulement l'APK signé d'essai, job manuel (docs/developpement.md, section Release).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^essai\//
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - install
  - release

default:
  interruptible: true

# Jobs de release : seulement sur un tag de version.
# UPDATES_URL : serveur central des mises à jour de la tablette (paquet générique du registre, privé).
.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    UPDATES_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/companion-updates/latest

# Zones du dépôt. Changer la CI relance tout.
.files-backend: &files-backend
  - backend/**/*
  - .gitlab-ci.yml
.files-android: &files-android
  - app/**/*
  - "*.gradle*"
  - gradle/**/*
  - gradlew*
  - scripts/test-android.sh
  - .gitlab-ci.yml
# Backend du Deck sur émulateur (android-emulateur) : serveur, faux pilotage, deck de test.
.files-deck-backend: &files-deck-backend
  - backend/src/**/*
  - backend/test/server.ts
  - backend/test/fake-os*.ts
  - backend/test/deck-emulateur.*
  - backend/package-lock.json
# Installation : pilote, lancement automatique, paquets, installeurs, aiguillage par système, sanity.
.files-install-common: &files-install-common
  - backend/scripts/**/*
  - backend/installer/**/*
  - backend/src/os.ts
  - backend/src/paths.ts
  - backend/package-lock.json
  - backend/qa/**/*
  - .gitlab-ci.yml
.files-install-windows: &files-install-windows
  - backend/src/win/**/*
# Pilote Windows et lanceur (C#) : sources, SDK, icône, fins de ligne.
.files-helper-windows: &files-helper-windows
  - backend/src/win/**/*
  - backend/global.json
  - backend/assets/compagnon.ico
  - backend/qa/build-helper-windows.ps1
  - .gitattributes
  - .gitlab-ci.yml

# En MR : seulement si la zone a bougé. Ailleurs (main, tag) : toujours.
.zone-backend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-backend
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
.zone-android:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-android
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
.zone-install-windows:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-install-common
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-install-windows
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
.zone-helper-windows:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-helper-windows
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

# Toujours là : une MR qui ne touche aucune zone (docs) a quand même un pipeline, sans lequel elle ne fusionne pas.
zones:
  stage: test
  image: node:22.22-bookworm-slim
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Jobs lancés selon les zones touchées (docs/developpement.md, section CI)."

.node:
  image: node:22.22-bookworm-slim
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund

backend:
  extends: [.node, .zone-backend]
  stage: test
  script:
    # Format (prettier --check) puis typecheck.
    - npm run lint
    # Tests d'intégration : le vrai serveur démarre avec un dossier de données vide.
    # Sous c8 : échoue si la couverture passe sous les seuils de backend/.c8rc.json.
    - npx c8 node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=junit.xml "test/**/*.test.ts"
  coverage: '/^Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    expire_in: 1 week

# Pages web du backend (page locale, visualiseur /camera, retour OAuth) dans Chromium, même serveur que les tests d'intégration.
# Tag de l'image = version exacte de @playwright/test dans backend/package.json : les monter ensemble.
e2e:
  extends: .zone-backend
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run test:e2e
  artifacts:
    when: always
    # junit.xml + traces des tests en échec (npx playwright show-trace <trace.zip>).
    paths:
      - backend/e2e-results/
    reports:
      junit: backend/e2e-results/junit.xml
    expire_in: 1 week

.android:
  image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - app/build.gradle.kts
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/

android:
  extends: [.android, .zone-android]
  stage: test
  script:
    - ./gradlew --no-daemon --console=plain ktlintCheck testDebugUnitTest lintDebug assembleDebug
  artifacts:
    when: always
    name: companion-debug-$CI_COMMIT_SHORT_SHA
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/reports/lint-results-debug.html
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    expire_in: 2 weeks

# Installation du paquet Mac sur le Mac d'un développeur (runner shell, tag macos) : backend/qa/install-mac.sh.
# Instance de test isolée de son vrai compagnon (agent, port, données à part), rien ne s'affiche à l'écran.
# Obligatoire seulement si l'installation ou le pilotage du Mac ont bougé (Mac éteint = job en attente) ;
# sur les autres MR, à lancer à la main.
install-mac:
  stage: test
  tags: [macos]
  needs: []
  interruptible: true
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key: install-mac
    paths:
      - .npm/
      - backend/.cache/node/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/src/mac/**/*
        - backend/src/os.ts
        - backend/src/paths.ts
        - backend/scripts/service.ts
        - backend/scripts/package.ts
        - backend/installer/mac/**/*
        - backend/assets/compagnon.icns
        - backend/package-lock.json
        - backend/qa/install-mac.sh
        - backend/qa/sanity.ts
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
  script:
    # node@18 passe avant dans le PATH du runner : celui de Homebrew (22 ou plus).
    - export PATH="/opt/homebrew/bin:$PATH"
    - node --version
    - node -e 'process.exit(Number(+process.versions.node.split(".")[0] < 22))'
    - (cd backend && npm ci --prefer-offline --no-audit --no-fund && npm run package -- mac)
    - backend/qa/install-mac.sh run dist/Compagnon-Unowhy-Mac.zip sanity-mac.xml
  after_script:
    - backend/qa/install-mac.sh cleanup
  artifacts:
    when: always
    paths:
      - install-mac-backend.log
    reports:
      junit: sanity-mac.xml
    expire_in: 1 week

# Tests instrumentés (app/src/androidTest/) sur un émulateur Android 10 sans services Google, 1280×800.
# Le runner Kubernetes partagé expose /dev/kvm (pod privilégié) : démarrage en ~25 s. Même script qu'en local.
android-emulateur:
  extends: .android
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-android
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-deck-backend
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
  timeout: 30m
  cache:
    policy: pull
  script:
    - scripts/test-android.sh
  artifacts:
    when: always
    paths:
      - app/build/test-android/
      - app/build/reports/androidTests/
    reports:
      junit: app/build/outputs/androidTest-results/connected/debug/*.xml
    expire_in: 2 weeks

# Installeurs de l'ordinateur (node embarqué) : backend/scripts/package.ts. Un job par plateforme : les deux
# ensemble dépassent la limite d'artefacts par défaut (100 Mo). Consommés par les tests d'installation et la release.
# nsis : makensis compile l'installeur Windows (Debian bookworm : NSIS 3.08).
.package:
  extends: .node
  stage: build
  dependencies: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends zip unzip nsis > /dev/null
    - !reference [.node, before_script]
  script:
    - npm run package -- $PLATFORM
  artifacts:
    paths:
      - dist/*.zip
      - dist/*.exe
    expire_in: 1 week

package-windows:
  extends: [.package, .zone-install-windows]
  variables:
    PLATFORM: windows

# install-mac fabrique son propre paquet : celui-ci sert à la release (et tourne sur main).
package-mac:
  extends: .package
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
  variables:
    PLATFORM: mac

# Installeur Windows lancé sur un vrai PC (runner « Local QA runner », shell PowerShell, session de bureau ouverte) :
# installation silencieuse, lancement automatique, sanity, pilote, désinstalleur. Tout est propre au test
# (backend/qa/install-windows.ps1) ; after_script nettoie même après un échec : le PC sert aussi aux tests UEM.
install-windows:
  # Runner 976 en ref_protected : en MR, seulement depuis une branche ci/* (protégée), sinon le job attendrait
  # sans fin et bloquerait la MR. Les autres MR de la zone le voient tourner sur main.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^ci\//
      when: never
    - !reference [.zone-install-windows, rules]
  stage: install
  tags: [local-runner]
  image: null
  needs: [package-windows]
  variables:
    GIT_DEPTH: 1
  before_script:
    - '& backend\qa\install-windows.ps1 -Nettoyage'
  script:
    - '& backend\qa\install-windows.ps1 -Installeur dist\Compagnon-Unowhy-Windows.exe -Junit sanity-windows.xml -Logs install-logs'
  after_script:
    - '& backend\qa\install-windows.ps1 -Nettoyage'
  artifacts:
    when: always
    paths:
      - install-logs/
    reports:
      junit: sanity-windows.xml
    expire_in: 1 week

# Pilote et lanceur recompilés sous Windows : échoue si le C# ne compile pas ou si les exe commités ne sont plus
# ceux des sources (backend/qa/build-helper-windows.ps1). Runner partagé « HiSqool Windows » (Docker, Server Core,
# sans bureau : suffit pour compiler) ; image au SDK exact de backend/global.json, à monter ensemble.
helper-windows:
  extends: .zone-helper-windows
  stage: test
  tags: [windows, docker]
  image: mcr.microsoft.com/dotnet/sdk:8.0.427-windowsservercore-ltsc2019@sha256:3c439035c6dd8087f43a034da64271af7e41e552b059cacc33ad23a164988b60
  needs: []
  variables:
    GIT_DEPTH: 1
    # Clone neuf : un dossier réutilisé garde les fins de ligne d'un checkout antérieur au .gitattributes.
    GIT_STRATEGY: clone
  script:
    - '& backend\qa\build-helper-windows.ps1 -Work .dotnet-ci'
  # Exe recompilés, à commiter si le job échoue sur leur comparaison.
  artifacts:
    when: on_failure
    name: helper-windows-$CI_COMMIT_SHORT_SHA
    paths:
      - backend/src/win/*.exe
    expire_in: 1 week

# APK release signé, version = $VERSION. Clé : variables protégées et masquées, visibles seulement des refs protégées
# (tags v*, branches essai/*). Publie aussi l'entrée du « serveur Unowhy » (companion-$VERSION.json), lue par
# `npm run updates:add` et les jobs updates / essai-updates.
.android-signed:
  script:
    - test -n "$RELEASE_KEYSTORE_BASE64" -a -n "$RELEASE_KEYSTORE_PASSWORD"
      || { echo "Clé de signature absente (variables RELEASE_KEYSTORE_*, ref protégée)"; exit 1; }
    - test -n "$UPDATE_DEPLOY_TOKEN" || { echo "Jeton de lecture des mises à jour absent (UPDATE_DEPLOY_TOKEN)"; exit 1; }
    - echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.p12
    # Jeton de lecture seule du registre (deploy token read_package_registry), jamais affiché.
    - >-
      RELEASE_KEYSTORE=/tmp/release.p12 ./gradlew --no-daemon --console=plain assembleRelease -PappVersion=$VERSION
      -PupdateUrl="$UPDATES_URL" -PupdateHeader="Deploy-Token: $UPDATE_DEPLOY_TOKEN"
    - mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk dist/companion-$VERSION.apk
    - $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs dist/companion-$VERSION.apk
    # Paquet, libellé et code lus dans l'APK : com.unowhy.companion « Companion », ou l'essai com.unowhy.companion.essai
    # « Companion essai », appli à part installée à côté (app/build.gradle.kts).
    - $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging dist/companion-$VERSION.apk > /tmp/badging.txt
    - PKG=$(sed -n "1s/^package:.name='\([^']*\)'.*/\1/p" /tmp/badging.txt)
    - CODE=$(sed -n "1s/.*versionCode='\([0-9]*\)'.*/\1/p" /tmp/badging.txt)
    - LABEL=$(sed -n "s/^application-label:'\(.*\)'$/\1/p" /tmp/badging.txt)
    # Un essai qui porterait le paquet de la stable la remplacerait sur la tablette, sans retour possible.
    - case "$VERSION" in *-essai.*) WANT=com.unowhy.companion.essai ;; *) WANT=com.unowhy.companion ;; esac
    - test "$PKG" = "$WANT" || { echo "Paquet « $PKG » pour la version $VERSION, attendu $WANT"; exit 1; }
    - jq -n --arg p "$PKG" --arg l "$LABEL" --arg v "$VERSION" --argjson c "$CODE" --arg f "companion-$VERSION.apk"
      '{package:$p, label:$l, versionCode:$c, versionName:$v, file:$f}'
      > dist/companion-$VERSION.json
    - cat dist/companion-$VERSION.json

# Version = tag.
android-release:
  extends: [.android, .release-tag]
  stage: build
  dependencies: []
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - !reference [.android-signed, script]
  artifacts:
    paths:
      - dist/companion-*
    expire_in: 1 week

# Serveur central des mises à jour de la tablette : manifest.json, l'APK de la dernière version et les installeurs de
# l'ordinateur (que la tablette télécharge puis sert sur son WiFi) déposés dans le paquet générique UPDATES_URL (jeton
# du job), anciens fichiers supprimés. Voir docs/developpement.md, section Release.
updates:
  extends: .release-tag
  stage: release
  image: node:22.22-bookworm-slim
  needs: [android-release, package-windows, package-mac]
  script:
    - node scripts/updates-publish.mjs dist updates

# Essai de l'appli tablette depuis une MR, sans fusion ni tag : branche protégée essai/mr-<iid> poussée depuis la branche
# de la MR, puis job manuel. Version X.Y.Z-essai.N (X.Y.Z = dernier tag de la branche, N = numéro du pipeline) : code
# entre ce tag et le suivant. Version en -essai.N = autre appli, com.unowhy.companion.essai « Companion essai »
# (app/build.gradle.kts), installée par la stable à côté d'elle : la stable reste device owner, on revient à elle sans
# réinstaller. Branche non protégée : pas de job (clé invisible).
essai-android:
  extends: .android
  stage: build
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^essai\// && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
  variables:
    # Tous les commits et les tags, pour git describe.
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: --prune --quiet --tags
    UPDATES_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/companion-updates/latest
  script:
    - TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*")
      || { echo "Aucun tag vX.Y.Z dans l'historique de la branche"; exit 1; }
    - VERSION=${TAG#v}-essai.$CI_PIPELINE_IID
    - !reference [.android-signed, script]
  # APK signé par la clé de release : gardé peu de temps.
  artifacts:
    paths:
      - dist/companion-*
    expire_in: 1 day

# Paquet companion-updates/essai, jamais latest (aucune tablette ne le lit seule). Un seul essai : le dernier remplace.
essai-updates:
  stage: release
  image: node:22.22-bookworm-slim
  needs: [essai-android]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^essai\// && $CI_COMMIT_REF_PROTECTED == "true"
  variables:
    UPDATES_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/companion-updates/essai
  script:
    - node scripts/updates-publish.mjs dist updates
    - |
      echo "Essai publié. Sur l'ordinateur de la tablette, dans backend/ (GITLAB_TOKEN ou UPDATE_DEPLOY_TOKEN dans backend/.env) :"
      echo "  npm run updates:essai                  # compagnon lancé depuis le dépôt"
      echo "  DATA_DIR=paquet npm run updates:essai  # compagnon installé par paquet"
      echo "Puis sur la tablette : Réglages > Mises à jour."

# Release GitLab : liens vers les fichiers des jobs du tag, pas de copie dans le registre (le zip Mac y reçoit un 500
# avec le jeton du job). Fichiers gardés : dernière pipeline réussie du tag (« Keep artifacts from most recent successful jobs »).
release:
  extends: .release-tag
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0@sha256:f6837b5aea075ca297281b554556d2fc4f8fb291ace6b48286790790dce622cd
  needs:
    - { job: package-windows, artifacts: false }
    - { job: package-mac, artifacts: false }
    - { job: android-release, artifacts: false }
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      BASE="$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist"
      LINKS=""
      for f in Compagnon-Unowhy-Windows.exe:package-windows Compagnon-Unowhy-Mac.zip:package-mac \
        companion-$VERSION.apk:android-release companion-$VERSION.json:android-release; do
        LINKS="$LINKS{\"name\":\"${f%%:*}\",\"url\":\"$BASE/${f%%:*}?job=${f##*:}\",\"link_type\":\"package\"},"
      done
      glab release create "$CI_COMMIT_TAG" --ref "$CI_COMMIT_SHA" --name "Compagnon $CI_COMMIT_TAG" \
        --notes "Installeurs de l'ordinateur (Windows, Mac) et APK de la tablette. Mise à jour de la tablette par le « serveur Unowhy » : docs/developpement.md, section Release." \
        --assets-links "[${LINKS%,}]"
