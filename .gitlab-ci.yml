# CI : sur chaque MR, sur main et sur les tags. Rien n'arrive sur main sans pipeline vert.
# En MR, seuls les jobs de la zone touchée tournent (rules:changes, voir docs/developpement.md, section CI) ;
# sur main et sur un tag, tout tourne.
# Tag vX.Y.Z : mêmes tests, puis applis portables de l'ordinateur, APK signé et release GitLab.
# Branche protégée essai/mr-<iid> : l'APK signé d'essai (job manuel) et, si backend/ change, l'archive du backend, publiés
# dans le paquet commun companion-updates/essais, une entrée par MR (docs/developpement.md, section Release).
# Sur main, purge-essais retire de ce paquet les entrées des MR fusionnées.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^essai\//
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release
  - site

default:
  interruptible: true

# Jobs de release : seulement sur un tag de version.
# UPDATES_URL : serveur central des mises à jour de la tablette (paquet générique du registre, privé).
.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    UPDATES_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/companion-updates/latest

# Zones du dépôt. Changer la CI relance tout.
.files-backend: &files-backend
  - backend/**/*
  - .gitlab-ci.yml
.files-site: &files-site
  - site/**/*
  - scripts/site-downloads.mjs
  - .gitlab-ci.yml
.files-android: &files-android
  - app/**/*
  - "*.gradle*"
  - gradle/**/*
  - gradlew*
  - .gitlab-ci.yml

# En MR : seulement si la zone a bougé. Ailleurs (main, tag) : toujours.
.zone-backend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-backend
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
# Site vitrine : en MR, image construite sans être poussée ; sur main, poussée si site/ change ; sur un tag de version,
# toujours (nouveaux installeurs dans l'image).
.zone-site:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-site
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *files-site
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
.zone-android:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *files-android
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

# Toujours là : une MR qui ne touche aucune zone (docs) a quand même un pipeline, sans lequel elle ne fusionne pas.
zones:
  stage: test
  image: node:22.22-bookworm-slim
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Jobs lancés selon les zones touchées (docs/developpement.md, section CI)."

.node:
  image: node:22.22-bookworm-slim
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund

backend:
  extends: [.node, .zone-backend]
  stage: test
  # Image avec git : le test de purge-essais lit un vrai historique git (la slim n'en a pas).
  image: node:22.22-bookworm
  script:
    # Format (prettier --check) puis typecheck.
    - npm run lint
    # Tests d'intégration : le vrai serveur démarre avec un dossier de données vide.
    # Sous c8 : échoue si la couverture passe sous les seuils de backend/.c8rc.json.
    - npx c8 node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=junit.xml "test/**/*.test.ts"
  coverage: '/^Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    expire_in: 1 week

# Pages web du backend (page locale, visualiseur /camera, retour OAuth) dans Chromium, même serveur que les tests d'intégration.
# Tag de l'image = version exacte de @playwright/test dans backend/package.json : les monter ensemble.
e2e:
  extends: .zone-backend
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run test:e2e
  artifacts:
    when: always
    # junit.xml + traces des tests en échec (npx playwright show-trace <trace.zip>).
    paths:
      - backend/e2e-results/
    reports:
      junit: backend/e2e-results/junit.xml
    expire_in: 1 week

.android:
  image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - app/build.gradle.kts
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/

android:
  extends: [.android, .zone-android]
  stage: test
  script:
    - ./gradlew --no-daemon --console=plain ktlintCheck testDebugUnitTest assembleDebug
  artifacts:
    when: always
    name: companion-debug-$CI_COMMIT_SHORT_SHA
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    expire_in: 2 weeks

# Applis portables de l'ordinateur, sans installation (node embarqué) : backend/scripts/package.ts. Un job par
# plateforme : les deux ensemble dépassent la limite d'artefacts par défaut (100 Mo). Seulement sur un tag de version,
# pour la release. zip et unzip : le runtime Windows est zippé puis ajouté à l'exe, l'appli Mac est zippée.
.package:
  extends: [.node, .release-tag]
  stage: build
  dependencies: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends zip unzip > /dev/null
    - !reference [.node, before_script]
  script:
    - npm run package -- $PLATFORM
  artifacts:
    paths:
      - dist/*.zip
      - dist/*.exe
    expire_in: 1 week

package-windows:
  extends: .package
  variables:
    PLATFORM: windows

package-mac:
  extends: .package
  variables:
    PLATFORM: mac

# Archives du backend de la release (sans node ni lanceur, version du tag) : la tablette en envoie une à l'ordinateur
# actif, qui se met à jour sans installeur (backend/src/essai-backend.ts, applyUpdate).
package-backend:
  extends: [.node, .release-tag]
  stage: build
  dependencies: []
  script:
    - npm run package -- essai
  artifacts:
    paths:
      - dist/backend-*.tar.gz
    expire_in: 1 week

# Pilote et lanceur recompilés sous Windows : échoue si le C# ne compile pas ou si les exe commités ne sont plus
# ceux des sources (backend/qa/build-helper-windows.ps1). Runner partagé « HiSqool Windows » (Docker, Server Core,
# sans bureau : suffit pour compiler) ; image au SDK exact de backend/global.json, à monter ensemble.
# Seulement sur un tag de version : en MR, `npm run build:helper` en local (/ship).
helper-windows:
  extends: .release-tag
  stage: test
  tags: [windows, docker]
  image: mcr.microsoft.com/dotnet/sdk:8.0.427-windowsservercore-ltsc2019@sha256:3c439035c6dd8087f43a034da64271af7e41e552b059cacc33ad23a164988b60
  needs: []
  variables:
    GIT_DEPTH: 1
    # Clone neuf : un dossier réutilisé garde les fins de ligne d'un checkout antérieur au .gitattributes.
    GIT_STRATEGY: clone
  script:
    - '& backend\qa\build-helper-windows.ps1 -Work .dotnet-ci'
  # Exe recompilés, à commiter si le job échoue sur leur comparaison.
  artifacts:
    when: on_failure
    name: helper-windows-$CI_COMMIT_SHORT_SHA
    paths:
      - backend/src/win/*.exe
    expire_in: 1 week

# APK release signé, version = $VERSION. Clé : variables protégées et masquées, visibles seulement des refs protégées
# (tags v*, branches essai/*). Publie aussi l'entrée du « serveur Unowhy » (companion-$VERSION.json), lue par
# `npm run updates:add` et les jobs updates / essai-updates.
.android-signed:
  script:
    - test -n "$RELEASE_KEYSTORE_BASE64" -a -n "$RELEASE_KEYSTORE_PASSWORD"
      || { echo "Clé de signature absente (variables RELEASE_KEYSTORE_*, ref protégée)"; exit 1; }
    - test -n "$UPDATE_DEPLOY_TOKEN" || { echo "Jeton de lecture des mises à jour absent (UPDATE_DEPLOY_TOKEN)"; exit 1; }
    - echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.p12
    # Jeton de lecture seule du registre (deploy token read_package_registry), jamais affiché.
    - >-
      RELEASE_KEYSTORE=/tmp/release.p12 ./gradlew --no-daemon --console=plain assembleRelease -PappVersion=$VERSION
      -PupdateUrl="$UPDATES_URL" -PupdateHeader="Deploy-Token: $UPDATE_DEPLOY_TOKEN"
    - mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk dist/companion-$VERSION.apk
    - $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs dist/companion-$VERSION.apk
    # Paquet, libellé et code lus dans l'APK : com.unowhy.companion « Companion », ou l'essai com.unowhy.companion.essai
    # « Companion essai », appli à part installée à côté (app/build.gradle.kts).
    - $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging dist/companion-$VERSION.apk > /tmp/badging.txt
    - PKG=$(sed -n "1s/^package:.name='\([^']*\)'.*/\1/p" /tmp/badging.txt)
    - CODE=$(sed -n "1s/.*versionCode='\([0-9]*\)'.*/\1/p" /tmp/badging.txt)
    - LABEL=$(sed -n "s/^application-label:'\(.*\)'$/\1/p" /tmp/badging.txt)
    # Un essai qui porterait le paquet de la stable la remplacerait sur la tablette, sans retour possible.
    - case "$VERSION" in *-essai.*) WANT=com.unowhy.companion.essai ;; *) WANT=com.unowhy.companion ;; esac
    - test "$PKG" = "$WANT" || { echo "Paquet « $PKG » pour la version $VERSION, attendu $WANT"; exit 1; }
    - jq -n --arg p "$PKG" --arg l "$LABEL" --arg v "$VERSION" --argjson c "$CODE" --arg f "companion-$VERSION.apk"
      '{package:$p, label:$l, versionCode:$c, versionName:$v, file:$f}'
      > dist/companion-$VERSION.json
    - cat dist/companion-$VERSION.json

# Version = tag.
android-release:
  extends: [.android, .release-tag]
  stage: build
  dependencies: []
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - !reference [.android-signed, script]
  artifacts:
    paths:
      - dist/companion-*
    expire_in: 1 week

# Serveur central des mises à jour de la tablette : manifest.json, l'APK de la dernière version, les applis de
# l'ordinateur (que la tablette télécharge puis sert sur son WiFi) et les archives du backend (mise à jour de
# l'ordinateur depuis la tablette) déposés dans le paquet générique UPDATES_URL (jeton
# du job), anciens fichiers supprimés. Voir docs/developpement.md, section Release.
updates:
  extends: .release-tag
  stage: release
  image: node:22.22-bookworm-slim
  needs: [android-release, package-windows, package-mac, package-backend]
  script:
    - node scripts/updates-publish.mjs dist updates

# Essai de l'appli tablette depuis une MR, sans fusion ni tag : branche protégée essai/mr-<iid> poussée depuis la branche
# de la MR, puis job manuel. Version X.Y.Z-essai.N (X.Y.Z = dernier tag de la branche, N = numéro du pipeline) : code
# entre ce tag et le suivant. Version en -essai.N = autre appli, com.unowhy.companion.essai « Companion essai »
# (app/build.gradle.kts), installée par la stable à côté d'elle : la stable reste device owner et revient à elle sans
# réinstaller. Branche non protégée : pas de job (clé invisible).
# dist/backend-changed : backend/ diffère de main, donc essai-backend fabrique l'archive du backend de la MR.
essai-android:
  extends: .android
  stage: build
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^essai\// && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
  variables:
    # Tous les commits et les tags, pour git describe.
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: --prune --quiet --tags
    UPDATES_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/companion-updates/latest
  script:
    - TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*")
      || { echo "Aucun tag vX.Y.Z dans l'historique de la branche"; exit 1; }
    - VERSION=${TAG#v}-essai.$CI_PIPELINE_IID
    - !reference [.android-signed, script]
    - git fetch --quiet origin main:refs/remotes/origin/main
    - CHANGED=$(git diff --name-only origin/main...HEAD -- backend/)
    - test -z "$CHANGED" || touch dist/backend-changed
  # APK signé par la clé de release : gardé peu de temps.
  artifacts:
    paths:
      - dist/companion-*
      - dist/backend-changed
    expire_in: 1 day

# Archive du backend de la MR (sans node ni lanceur Windows), pour les deux plateformes : la tablette l'envoie à
# l'ordinateur (backend/src/essai-backend.ts). Seulement si backend/ diffère de main.
essai-backend:
  extends: .node
  stage: build
  needs: [essai-android]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^essai\// && $CI_COMMIT_REF_PROTECTED == "true"
  before_script: []
  script:
    - |
      test -f dist/backend-changed || { echo "backend/ identique à main, pas d'archive backend."; exit 0; }
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run package -- essai
  artifacts:
    paths:
      - dist/backend-*.tar.gz
    expire_in: 1 day

# Paquet companion-updates/essais, jamais latest (aucune tablette ne le lit seule) : une entrée par MR dans manifest.json,
# la MR ne remplace que la sienne. resource_group : les publications se suivent (lecture puis écriture du manifest).
# Titre de la MR : variable MR_TITLE du pipeline, posée par .claude/skills/ship/essai.sh.
essai-updates:
  stage: release
  image: node:22.22-bookworm-slim
  needs: [essai-android, essai-backend]
  resource_group: essais
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^essai\// && $CI_COMMIT_REF_PROTECTED == "true"
  variables:
    UPDATES_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/companion-updates/essais
  script:
    - node scripts/updates-publish.mjs --essai "${CI_COMMIT_BRANCH#essai/mr-}" dist updates
    - echo "Essai publié. Sur la tablette, Réglages > Mises à jour > Rechercher, puis choisir la MR."

# Essais des MR fusionnées : sur main, retire de companion-updates/essais les entrées dont la MR figure dans l'historique
# (lignes « See merge request <projet>!N »), donc plus listées dans Réglages > Mises à jour. Historique complet, et image
# avec git (la slim n'en a pas). Même resource_group que essai-updates : jamais pendant une publication.
purge-essais:
  stage: release
  image: node:22.22-bookworm
  needs: []
  interruptible: false
  resource_group: essais
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
    UPDATES_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/companion-updates/essais
  script:
    - node scripts/updates-publish.mjs --purge-fusionnes updates

# Release GitLab : liens vers les fichiers des jobs du tag, pas de copie dans le registre (le zip Mac y reçoit un 500
# avec le jeton du job). Fichiers gardés : dernière pipeline réussie du tag (« Keep artifacts from most recent successful jobs »).
release:
  extends: .release-tag
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0@sha256:f6837b5aea075ca297281b554556d2fc4f8fb291ace6b48286790790dce622cd
  needs:
    - { job: package-windows, artifacts: false }
    - { job: package-mac, artifacts: false }
    - { job: android-release, artifacts: false }
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      BASE="$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist"
      LINKS=""
      for f in Compagnon-Unowhy-Windows.exe:package-windows Compagnon-Unowhy-Mac.zip:package-mac \
        companion-$VERSION.apk:android-release companion-$VERSION.json:android-release; do
        LINKS="$LINKS{\"name\":\"${f%%:*}\",\"url\":\"$BASE/${f%%:*}?job=${f##*:}\",\"link_type\":\"package\"},"
      done
      glab release create "$CI_COMMIT_TAG" --ref "$CI_COMMIT_SHA" --name "Compagnon $CI_COMMIT_TAG" \
        --notes "Applis portables de l'ordinateur (Windows, Mac) et APK de la tablette. Mise à jour de la tablette par le « serveur Unowhy » : docs/developpement.md, section Release." \
        --assets-links "[${LINKS%,}]"

# --- Site vitrine Mate (site/) : image nginx dans Harbor (harbor.unowhy.dev/squads/mate-site), déployée à la main sur le
# cluster dev avec deploy/site-dev/ (VirtualService Istio, mate.development.unowhy.dev). Même façon de faire que les
# images des squads (sqool-deploy) : docker-in-docker du proxy Harbor, connexion par HARBOR_REGISTRY_USERNAME /
# HARBOR_REGISTRY_PASSWORD (variables CI masquées, à demander à l'équipe plateforme). La CI construit et pousse seulement.

# Installeurs de la dernière release (scripts/site-downloads.mjs), mis dans l'image. Sur un tag : après leur publication.
site-downloads:
  extends: .zone-site
  stage: site
  image: node:22.22-bookworm-slim
  needs:
    - { job: updates, optional: true }
  variables:
    UPDATES_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/companion-updates/latest
  script:
    - node scripts/site-downloads.mjs site/downloads
  artifacts:
    paths:
      - site/downloads/
    expire_in: 1 day

# Tags de l'image : main (suivi par Keel sur le cluster dev, deploy/site-dev/deployment.yaml) et le commit ; sur un tag
# de version, vX.Y.Z aussi. En MR : construite, jamais poussée (vérifie le Dockerfile).
site-image:
  extends: .zone-site
  stage: site
  needs: [site-downloads]
  image: harbor.unowhy.dev/docker-hub-proxy/library/docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - name: harbor.unowhy.dev/docker-hub-proxy/library/docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  timeout: 10 minutes
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    SITE_IMAGE: harbor.unowhy.dev/squads/mate-site
  script:
    - |
      for i in $(seq 20); do docker info >/dev/null 2>&1 && break; echo "Attente de docker…"; sleep 1; done
      docker info >/dev/null
    - docker build --label org.opencontainers.image.revision=$CI_COMMIT_SHA --label org.opencontainers.image.source=$CI_PROJECT_URL -t site site
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then echo "MR : image construite, pas poussée."; exit 0; fi
      test -n "$HARBOR_REGISTRY_USERNAME" || { echo "HARBOR_REGISTRY_USERNAME / HARBOR_REGISTRY_PASSWORD absentes des variables CI"; exit 1; }
      echo "$HARBOR_REGISTRY_PASSWORD" | docker login -u "$HARBOR_REGISTRY_USERNAME" --password-stdin harbor.unowhy.dev
      TAGS="$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS $CI_COMMIT_TAG main"; else TAGS="$TAGS main"; fi
      for t in $TAGS; do docker tag site "$SITE_IMAGE:$t" && docker push "$SITE_IMAGE:$t"; done
