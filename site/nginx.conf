# Site vitrine Mate dans l'image Docker (site/Dockerfile) : fichiers statiques, port 8080 (nginx sans root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Sondes de Kubernetes (deploy/site-dev/deployment.yaml).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Installeurs de la dernière release (scripts/site-downloads.mjs) : toujours téléchargés, jamais affichés.
    location /downloads/ {
        add_header Content-Disposition attachment always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }
}
