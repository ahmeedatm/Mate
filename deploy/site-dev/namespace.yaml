# Namespace du site vitrine, avec les étiquettes des namespaces des squads : révision Istio du cluster dev, et les trois
# étiquettes hisqool.dev/* que suit istiod (discoverySelectors du maillage ; sans elles, pas de certificat dans le namespace).
apiVersion: v1
kind: Namespace
metadata:
  name: mate
  labels:
    istio.io/rev: devops-prod-stable-1-30-0
    hisqool.dev/ingress: istio
    hisqool.dev/migration: ingress
    hisqool.dev/team: devops
