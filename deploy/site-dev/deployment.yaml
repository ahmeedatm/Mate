apiVersion: apps/v1
kind: Deployment
metadata:
  name: mate-site
  annotations:
    # Comme les fronts de sqool-deploy : Keel relit le tag « main » chaque minute et redéploie s'il a changé.
    keel.sh/match-tag: "true"
    keel.sh/policy: force
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/trigger: poll
spec:
  replicas: 1
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        # Injection du proxy Istio : la politique du cluster est « disabled », chaque pod la demande (comme les squads).
        sidecar.istio.io/inject: "true"
    spec:
      imagePullSecrets:
        - name: harbor-squads-mate-site-registry-credential
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: harbor.unowhy.dev/squads/mate-site:feat-site-image
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # nginx sans root écrit son pid et ses fichiers temporaires dans /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
