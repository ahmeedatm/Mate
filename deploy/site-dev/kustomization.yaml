# Site vitrine Mate sur le cluster dev : kubectl apply -k deploy/site-dev (voir README.md).
# Conventions de sqool-deploy : image Harbor squads/, secret harbor-squads-…-registry-credential, Keel, VirtualService Istio.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mate

labels:
  - pairs:
      app.kubernetes.io/name: mate-site
      app.kubernetes.io/part-of: unowhy-companion
    includeSelectors: true

resources:
  - deployment.yaml
  - service.yaml
  - virtualservice.yaml

# Image poussée par le job site-image de la CI ; « main » suit main, Keel redéploie à chaque nouvelle image.
images:
  - name: mate-site
    newName: harbor.unowhy.dev/squads/mate-site
    newTag: main
